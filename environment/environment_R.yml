# R environment used for all R notebooks (Jupyter IRkernel).
# Versions match the environment the paper figures were generated in (see sessionInfo_R.txt).
name: cfrna_cart_r
channels: [conda-forge, bioconda]
dependencies:
  - r-base=4.1.1
  - r-irkernel=1.3
  - bioconductor-deseq2=1.34.0
  - bioconductor-limma=3.50.3
  - bioconductor-edger=3.36.0
  - r-seurat=4.1.0
  - r-mice=3.16.0
  - r-survival=3.5_5
  - r-survminer=0.4.9
  - r-proc=1.18.0
  - r-dcurves=0.5.1
  - r-ggplot2=3.4.2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-purrr
  - r-stringr
  - r-tibble
  - r-data.table=1.15.4
  - r-patchwork=1.1.2
  - r-ggpubr=0.6.0
  - r-pheatmap=1.0.12
  - r-ggvenn=0.1.19
  - r-ggforce=0.4.1
  - r-ggrepel=0.9.4
  - r-forestplot=3.2.0
  - r-broom=1.0.5
  - r-reshape2
  - r-rcolorbrewer
  - r-scales
  - r-yaml=2.2.2
