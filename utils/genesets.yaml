# LymphoMAP archetype gene sets. This is the single source of truth, read by genesets.R and genesets.py.
#   LN   = lymph-node-like
#   FMAC = fibroblast / macrophage / endothelial-rich
#   TEX  = T-cell exhausted
# Ensembl IDs are GENCODE v38 (versioned), matching the rows of counts_raw / counts_norm.
# SIGLEC5 has two gene IDs in GENCODE v38, so LN has 21 Ensembl IDs for 20 symbols.

